name: Feature
description: A new capability
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Title: imperative verb + object + scope, 70 characters max, English, no `[Bug]` prefix. No client names or confidential details. Close through the PR with `Fixes #n`; one issue is about one PR and one day of work.
  - type: textarea
    id: what
    attributes:
      label: What and why
      placeholder: ""
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: ""
    validations:
      required: true
